<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sokoun UI review</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:32px;background:#f7f8f7;color:#111827;font:16px/1.5 system-ui,sans-serif}main{max-width:1440px;margin:auto}h1{margin:0 0 8px}p{max-width:800px;color:#4b5563}form{display:flex;flex-wrap:wrap;gap:16px;margin:24px 0}label{display:grid;gap:6px;font-size:14px}select{padding:10px 14px;border:1px solid #d1d5db;border-radius:8px;background:white;color:#111827;font:inherit}section{display:grid;grid-template-columns:1fr 1fr;gap:24px}figure{margin:0;min-width:0}figcaption{margin-bottom:8px;font-weight:600}img{display:block;width:100%;max-width:1024px;border:1px solid #e5e7eb;border-radius:12px;background:white}a{color:#0f766e}@media(max-width:700px){body{padding:16px}section{grid-template-columns:1fr}}
</style><main><h1>Sokoun UI review</h1><p>Actual Flutter renders using Tajawal and Material icons. Welcome is a complete screen; discovery and dashboard are isolated component fixtures with deterministic data. Property photos are deliberately absent from these fixtures.</p>
<form><label>Screen<select id="screen"><option value="welcome">Welcome</option><option value="discovery">Property cards</option><option value="dashboard">Dashboard metrics</option></select></label><label>Language<select id="locale"><option value="ar">Arabic</option><option value="en">English</option></select></label><label>Viewport<select id="width"><option value="390">Phone · 390 × 844</option><option value="1024">Tablet · 1024 × 768</option></select></label></form>
<section><figure><figcaption>Before</figcaption><img id="before" alt="UI before refinement"></figure><figure><figcaption>After</figcaption><img id="after" alt="UI after refinement"></figure></section><p><a href="README.md">Coverage and verification notes</a></p></main>
<script>
const controls=['screen','locale','width'].map(id=>document.getElementById(id));
function render(){const name=controls.map(control=>control.value).join('-')+'.png';for(const phase of ['before','after'])document.getElementById(phase).src=phase+'/'+name;}
controls.forEach(control=>control.addEventListener('change',render));render();
</script></html>
