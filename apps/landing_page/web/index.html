<!DOCTYPE html>
<html lang="ar">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="سكون منصة الإيجار الموثوقة في مصر. ابحث عن سكن أو اعرض عقارك بسهولة وأمان.">
  <meta name="theme-color" content="#0C6254">
  <meta name="color-scheme" content="light">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta property="og:type" content="website">
  <meta property="og:title" content="سكون | Sokoon">
  <meta property="og:description" content="اكتشف سكنك المناسب، احفظ المفضلة ورتب الزيارات. وللمالك: إدارة العقارات والطلبات من مكان واحد.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Sokoon">
  <link rel="apple-touch-icon" href="logo.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="logo.svg"/>

  <title>سكون | Sokoon</title>
  <link rel="manifest" href="manifest.json">
  <style>
    #sokoun-loading {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      background: #FAFBF8;
    }
    .loading-bar {
      width: 140px;
      height: 4px;
      overflow: hidden;
      border-radius: 4px;
      background: #E3EBE5;
    }
    .loading-bar::after {
      content: '';
      display: block;
      width: 50%;
      height: 100%;
      border-radius: inherit;
      background: #0C6254;
      animation: loading-progress 1s ease-in-out infinite alternate;
    }
    @keyframes loading-progress {
      to { transform: translateX(100%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .loading-bar::after { animation: none; width: 100%; }
    }
  </style>
</head>
<body style="margin:0;background:#FAFBF8">
  <div id="sokoun-loading" role="status" aria-busy="true">
    <img src="logo.svg" alt="سكون" width="96" height="96" fetchpriority="high">
    <div class="loading-bar" aria-hidden="true"></div>
  </div>
  <noscript>
    <style>#sokoun-loading { display: none; }</style>
    <main dir="rtl" style="max-width:640px;margin:80px auto;padding:24px;font-family:system-ui;text-align:center">
      <img src="logo.svg" alt="سكون" width="80" height="80">
      <h1>سكون — سكن ترتاح فيه</h1>
      <p>اكتشف العقارات واحفظ المفضلة ورتب الزيارات. أدر عقاراتك وطلباتك من مكان واحد.</p>
      <p>يرجى تفعيل JavaScript لتصفح الموقع. التطبيق قريبًا على iOS وAndroid.</p>
    </main>
  </noscript>
  <script>
    window.addEventListener('flutter-first-frame', () => {
      document.getElementById('sokoun-loading')?.remove();
    }, { once: true });

    async function loadLandingPage() {
      // Retire the old worker before requesting bootstrap: it may cache that
      // script too, so migration inside bootstrap cannot reach existing users.
      if ('serviceWorker' in navigator) {
        try {
          const registration = await navigator.serviceWorker.getRegistration(document.baseURI);
          const worker = registration?.active;
          if (worker && registration.scope === new URL('./', document.baseURI).href &&
              new URL(worker.scriptURL).pathname.endsWith('/flutter_service_worker.js')) {
            await registration.unregister();
            const controller = navigator.serviceWorker.controller;
            if (controller && new URL(controller.scriptURL).pathname === new URL(worker.scriptURL).pathname) {
              window.location.reload();
              return;
            }
          }
        } catch (error) {
          console.warn('Could not retire the legacy Flutter worker.', error);
        }
      }

      const bootstrap = document.createElement('script');
      bootstrap.src = new URL('flutter_bootstrap.js', document.baseURI).href;
      bootstrap.async = true;
      document.body.appendChild(bootstrap);
    }

    loadLandingPage().catch(error => console.error('Could not load Sokoun.', error));
  </script>
</body>
</html>
