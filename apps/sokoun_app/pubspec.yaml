name: sokoun_app
environment:
  sdk: ^3.9.0
resolution: workspace
version: 1.0.0+3

dependencies:
  flutter:
    sdk: flutter
  easy_localization: ^3.0.8
  easy_timer_count: ^0.0.4
  flutter_bloc: ^9.1.1
  flutter_cache_manager: ^3.4.1
  gal: ^2.3.3
  geocoding: ^4.0.0
  geolocator: ^14.0.2
  permission_handler: ^12.0.3
  equatable: ^2.0.8
  rename: ^3.1.0
